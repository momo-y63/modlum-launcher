name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Installer'ı mevcut bir Release'e ekle (örn. v1.0.0). Boş bırakılırsa yalnızca artifact üretilir."
        required: false
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: pnpm typecheck

      - name: Build installer
        run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modlum-launcher-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release with installer
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi

          # Release yoksa taslak olarak oluştur; installer yüklendikten sonra yayınla.
          CREATED=0
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES="docs/releases/${TAG}.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --draft --title "Modlum Launcher ${TAG#v}" --notes-file "$NOTES"
            else
              gh release create "$TAG" --draft --title "Modlum Launcher ${TAG#v}" --generate-notes
            fi
            CREATED=1
          fi

          gh release upload "$TAG" dist/*.exe --clobber

          if [ "$CREATED" = "1" ]; then
            gh release edit "$TAG" --draft=false
          fi
