name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Installer eklenecek release tag (örn. v1.1.0). Boşsa tag push kullanılır.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build installer
        run: pnpm tauri build --bundles nsis

      - name: Rename installer
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          SRC=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          mkdir -p artifacts
          cp "$SRC" "artifacts/ModlumLauncher-${VERSION}-Setup.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/*.exe
          if-no-files-found: error

      - name: Publish release with installer
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi

          # Release yoksa taslak olarak oluştur; installer yüklendikten sonra yayınla.
          CREATED=0
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES="docs/releases/${TAG}.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --draft --title "Modlum Launcher ${TAG#v}" --notes-file "$NOTES"
            else
              gh release create "$TAG" --draft --title "Modlum Launcher ${TAG#v}" --generate-notes
            fi
            CREATED=1
          fi

          gh release upload "$TAG" artifacts/*.exe --clobber

          if [ "$CREATED" = "1" ]; then
            gh release edit "$TAG" --draft=false
          fi
