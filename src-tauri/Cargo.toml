[package]
name = "modlum-launcher"
version = "1.1.0"
description = "Modlum Launcher - Minecraft baslatici"
authors = ["Modlum"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "modlum_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "time",
  "sync",
  "fs",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "native-tls",
] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
opener = "0.7"
rfd = "0.15"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
urlencoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
